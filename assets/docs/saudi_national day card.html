<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة اليوم الوطني السعودي التفاعلية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b2315;
            background-image: radial-gradient(#174528 1px, transparent 1px);
            background-size: 24px 24px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
            overflow-x: hidden;
        }

        .header-title {
            margin-bottom: 20px;
            text-align: center;
            color: #d4af37;
        }

        .header-title h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 6px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Card Container 3D Perspective */
        .card-container {
            width: 100%;
            max-width: 750px;
            height: 420px;
            perspective: 1500px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 20px rgba(212, 175, 55, 0.25);
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #d4af37;
            background-color: #0b2315;
        }

        .card-front img, .card-back img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        /* Instructions & Button */
        .hint-text {
            font-size: 0.95rem;
            color: #d4af37;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.03); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }

        .toggle-btn {
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: #0d2818;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            transition: all 0.3s ease;
        }

        .toggle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
            background: linear-gradient(135deg, #e5be48, #c49813);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .card-container {
                height: 320px;
            }
            .header-title h1 {
                font-size: 1.4rem;
            }
        }

        @media (max-width: 480px) {
            .card-container {
                height: 230px;
            }
            .header-title h1 {
                font-size: 1.2rem;
            }
            .hint-text {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
